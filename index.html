<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --court:#10293F; --court-2:#17384F; --court-3:#1E465F;
  --line:#2A5674; --chalk:#F4F6F5; --net:#8AA6B8;
  --ball:#F2C230; --done:#4FB286; --alert:#E4703A;
  --sans:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Barlow",-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--court)}
body{font-family:var(--sans);background:var(--court);color:var(--chalk);
  font-size:16px;line-height:1.5;padding-bottom:130px;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

.rail{position:sticky;top:0;z-index:40;background:var(--court);border-bottom:1px solid var(--line)}
.rail-scroll{max-width:640px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;
  padding:9px 12px;scrollbar-width:none}
.rail-scroll::-webkit-scrollbar{display:none}
.sesion{flex:0 0 auto;background:none;border:1px solid var(--line);padding:6px 11px 7px;
  cursor:pointer;text-align:left;transition:.15s;min-width:88px}
.sesion b{display:block;font-family:var(--cond);font-size:17px;font-weight:600;
  color:var(--chalk);line-height:1.1}
.sesion i{display:block;font-style:normal;font-size:11.5px;color:var(--net);margin-top:1px}
.sesion[aria-selected="true"]{border-color:var(--ball)}
.sesion[aria-selected="true"] b{color:var(--ball)}
.sesion.hecha{border-left:3px solid var(--done)}
.sesion:focus-visible{outline:2px solid var(--ball);outline-offset:2px}

.head{padding:24px 0 16px}
.eyebrow{font-size:13px;color:var(--net);margin-bottom:5px}
.head h1{font-family:var(--cond);font-size:clamp(42px,13vw,66px);font-weight:700;
  line-height:.88;letter-spacing:-.015em}
.focus{font-size:16px;color:var(--net);margin-top:8px;max-width:36ch}
.meters{display:flex;gap:18px;margin-top:18px;flex-wrap:wrap}
.meter{flex:1;min-width:118px}
.meter .n{font-family:var(--cond);font-size:27px;font-weight:600;line-height:1;
  font-variant-numeric:tabular-nums}
.meter .n small{font-size:15px;color:var(--net);font-weight:500}
.meter .lab{font-size:12px;color:var(--net);margin-top:3px}
.bar{height:3px;background:var(--court-3);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ball);width:0;transition:width .3s}
.bar.hot i{background:var(--alert)}

/* selectores */
.ctrl{margin-top:18px;display:flex;gap:16px;flex-wrap:wrap}
.ctrl-g{flex:1;min-width:180px}
.ctrl-lab{font-size:12px;color:var(--net);margin-bottom:6px}
.ctrl-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--cond);font-size:15.5px;font-weight:600;background:transparent;
  color:var(--net);border:1px solid var(--line);padding:5px 12px;cursor:pointer;transition:.15s}
.chip[aria-pressed="true"]{background:var(--ball);color:var(--court);border-color:var(--ball)}
.chip:focus-visible{outline:2px solid var(--ball);outline-offset:2px}
.ctrl-note{font-size:12.5px;color:var(--net);margin-top:7px;line-height:1.4}

.aviso{margin-top:16px;padding:12px 14px;background:var(--court-2);
  border-left:3px solid var(--ball);font-size:14px;line-height:1.5}
.aviso.riesgo{border-left-color:var(--alert)}
.aviso b{font-weight:600}
.aviso button{background:none;border:0;color:var(--ball);font:inherit;font-weight:600;
  cursor:pointer;text-decoration:underline;padding:0;margin-left:4px}

.phase{margin-top:16px;padding:13px 14px;background:var(--court-2);border-left:3px solid var(--ball)}
.phase-row{display:flex;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.phase p{font-size:13.5px;color:var(--net);line-height:1.45}

details.panel{margin-top:13px;background:var(--court-2);border:1px solid var(--line)}
details.panel summary{cursor:pointer;list-style:none;padding:12px 14px;
  font-family:var(--cond);font-size:18.5px;font-weight:600;
  display:flex;justify-content:space-between;align-items:center}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::after{content:"+";color:var(--ball);font-size:22px;line-height:1}
details.panel[open] summary::after{content:"–"}
.panel-body{padding:0 14px 14px;font-size:14.5px;color:var(--net);line-height:1.55}
.panel-body li{margin:7px 0 0 17px}
.panel-body h4{font-family:var(--cond);font-size:17px;color:var(--chalk);
  font-weight:600;margin:14px 0 2px}

.block{margin-top:28px}
.block-head{display:flex;align-items:baseline;gap:10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.block-head h2{font-family:var(--cond);font-size:21px;font-weight:600}
.block-head span{font-size:12.5px;color:var(--net);margin-left:auto}
.block.plyo .block-head h2{color:var(--ball)}

.ex{border-bottom:1px solid var(--line);padding:16px 0}
.ex.complete .ex-name{color:var(--done)}
.ex-top{display:flex;gap:11px;align-items:flex-start}
.ex-num{font-family:var(--cond);font-size:16px;font-weight:600;color:var(--net);
  padding-top:2px;min-width:15px;font-variant-numeric:tabular-nums}
.ex-name{font-family:var(--cond);font-size:23px;font-weight:600;line-height:1.12;flex:1}
.tag{font-family:var(--cond);font-size:12.5px;font-weight:600;letter-spacing:.03em;
  border:1px solid var(--line);color:var(--net);padding:2px 7px;margin-top:3px;flex:0 0 auto}
.tag.clave{border-color:var(--ball);color:var(--ball)}
.spec{display:flex;margin:10px 0 0 26px;border:1px solid var(--line)}
.spec div{flex:1;padding:7px 9px;border-right:1px solid var(--line);min-width:0}
.spec div:last-child{border-right:0}
.spec b{display:block;font-family:var(--cond);font-size:17px;font-weight:600;
  line-height:1.15;font-variant-numeric:tabular-nums}
.spec small{display:block;font-size:11px;color:var(--net);margin-top:1px}
.sets{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0 26px;align-items:center}
.set{width:42px;height:42px;background:transparent;border:1.5px solid var(--line);
  color:var(--net);font-family:var(--cond);font-size:18px;font-weight:600;cursor:pointer;
  transition:.12s;font-variant-numeric:tabular-nums}
.set[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--court)}
.set:focus-visible{outline:2px solid var(--ball);outline-offset:2px}
.sets .hint{font-size:12.5px;color:var(--net)}
.note{margin:11px 0 0 26px;font-size:13.8px;color:var(--net);line-height:1.5;
  border-left:2px solid var(--line);padding-left:11px;max-width:60ch}

.rest{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--court-2);
  border-top:2px solid var(--ball);transform:translateY(105%);transition:transform .22s ease;
  padding-bottom:env(safe-area-inset-bottom)}
.rest.up{transform:none}
.rest-in{max-width:640px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:13px}
.rest-time{font-family:var(--cond);font-size:40px;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;min-width:94px}
.rest-lab{font-size:13px;color:var(--net);flex:1;line-height:1.35}
.rest button{font-family:var(--cond);font-size:16px;font-weight:600;background:transparent;
  color:var(--chalk);border:1px solid var(--line);padding:8px 13px;cursor:pointer}
.rest.over .rest-time{color:var(--done)}
.rest-bar{height:3px;background:var(--court-3)}
.rest-bar i{display:block;height:100%;background:var(--ball);width:100%}

.foot{margin:30px 0 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--cond);font-size:17px;font-weight:600;background:transparent;
  color:var(--net);border:1px solid var(--line);padding:11px 17px;cursor:pointer}
.btn:hover{color:var(--chalk);border-color:var(--net)}
.btn.main{background:var(--ball);color:var(--court);border-color:var(--ball)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--ball);outline-offset:2px}
.foot-note{font-size:12.5px;color:var(--net);flex-basis:100%}

.reg h2{font-family:var(--cond);font-size:26px;font-weight:600;margin-bottom:4px}
.reg-sub{font-size:14px;color:var(--net);margin-bottom:20px;max-width:46ch}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:24px}
.stat{flex:1;min-width:110px;border-top:1px solid var(--line);padding-top:9px}
.stat .n{font-family:var(--cond);font-size:30px;font-weight:600;line-height:1;
  font-variant-numeric:tabular-nums}
.stat .lab{font-size:12.5px;color:var(--net);margin-top:3px}
.entry{display:flex;gap:12px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.entry .f{font-family:var(--cond);font-size:16px;color:var(--net);min-width:74px;
  font-variant-numeric:tabular-nums}
.entry .g{font-family:var(--cond);font-size:20px;font-weight:600;flex:1;line-height:1.15}
.entry .g small{display:block;font-family:var(--sans);font-size:12.5px;font-weight:400;
  color:var(--net);margin-top:1px}
.entry .v{font-size:13.5px;color:var(--net);text-align:right;
  font-variant-numeric:tabular-nums;min-width:96px}
.vacio{padding:26px 0;font-size:15px;color:var(--net);line-height:1.6;max-width:44ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<nav class="rail"><div class="rail-scroll" id="rail" role="tablist" aria-label="Sesiones"></div></nav>
<main class="wrap" id="app"></main>

<div class="rest" id="rest">
  <div class="rest-bar"><i id="restBar"></i></div>
  <div class="rest-in">
    <div class="rest-time" id="restTime">0:00</div>
    <div class="rest-lab" id="restLab">Descanso</div>
    <button id="restAdd">+30 s</button>
    <button id="restEnd">Listo</button>
  </div>
</div>

<script>
/* ============================================================
   PROGRAMA
   s series · sr series en reducida · sm series en mínima
   niv 1 clave · 2 reducida · 3 completa
   loc "Ambos" | "Casa" | "Espacio"
   k contactos por serie · kb contactos de baja amplitud por serie
   ============================================================ */

const CAL = [
  "2 a 3 min de cuerda a ritmo cómodo. Sustituye al trote: eleva temperatura y despierta el tobillo a la vez, y sirve en todas las sesiones, no solo en las de pierna.",
  "5 min de movilidad: tobillo contra pared, cadera en 90/90, rotación torácica, círculos de hombro.",
  "20 pogos suaves para despertar el reflejo de estiramiento.",
  "En sesiones de pierna: 3×15 s de skipping alto en el sitio con las muñequeras de 2 kg en los tobillos, antes de los saltos progresivos.",
  "En sesiones de salto: 3 saltos progresivos al 60 %, 80 % y 90 % antes de la primera serie real.",
  "En sesiones de tirón y empuje: 1 serie de aproximación con la mitad de las repeticiones, sin chaleco.",
  "El calentamiento no se recorta nunca, ni en la versión mínima."
];

const REGLAS = [
  "La pliometría va primero y fresca. Si la haces cansado, entrenas resistencia, no potencia.",
  "Nunca saltes con chaleco. El chaleco es para fuerza.",
  "Si la altura del salto baja o el pie tarda más en despegar, la serie se terminó.",
  "2 a 3 minutos de descanso en saltos y series pesadas. El descanso corto aquí estorba.",
  "Molestia en el tendón rotuliano o de Aquiles significa bajar contactos, no aguantar.",
  "Todo lo unilateral empieza por la izquierda y la derecha iguala sus repeticiones. Regla activa hasta que la asimetría baje del 10 %.",
  "Dominadas y fondos estrictos: sin balanceo, sin rebote. Si no llegas al rango, quita peso del chaleco.",
  "Entre las dos sesiones de pierna deja al menos 48 horas."
];

const JUEGO = {
  antes:[
    "Justo antes de jugar no se entrena: ni fuerza ni pliometría. Llegas fatigado, saltas más bajo y subes el riesgo en el momento de mayor exigencia.",
    "Entrenar en la mañana y jugar en la noche sí es viable. Tirón y empuje sin restricción; piernas fuerza en versión mínima y sin llegar al fallo, dejando 2 o 3 repeticiones en reserva.",
    "Piernas reactivo el mismo día que juegas, no. Si juegas voleibol, el juego ES tu sesión reactiva.",
    "Si el partido importa, la mañana es solo movilidad. La sesión se corre; el partido no."
  ],
  calentar:[
    "Elevar, 3 min: cuerda a ritmo cómodo o trote suave.",
    "Movilizar, 3 min: tobillo contra pared, cadera 90/90, rotación torácica, círculos de hombro.",
    "Activar, 4 min: desplazamiento lateral con banda 2×20 s · rumano a una pierna sin peso 2×8 lento · rotación externa 2×12.",
    "Potenciar, 4 min: pogos suaves 2×10 · saltos al 60 %, 70 % y 85 %, tres de cada · dos o tres aproximaciones de remate, o cuatro cambios de dirección en tenis.",
    "Subes intensidad, no volumen. Terminas activado, no cansado."
  ],
  despues:[
    "Nunca antes de jugar: estiramiento estático sostenido, series al fallo, drop jumps, sprints máximos o trabajo con chaleco.",
    "Después de jugar sí cabe el bloque preventivo de hombro y, si quedan fuerzas, la fuerza de pierna.",
    "Si el día fue exigente, el siguiente es descanso o tren superior. No pierna.",
    "Si juegas dos veces por semana, quita piernas reactivo del microciclo y quédate con piernas fuerza."
  ]
};

const SESIONES = [
 {id:"piernas-f",grupo:"Piernas",var:"Fuerza",pierna:true,
  foco:"Fuerza máxima de pierna y salto máximo",
  bloques:[
   {t:"Potencia",plyo:true,ej:"PLYO_FUERZA"},
   {t:"Fuerza",ej:[
    {x:"Sentadilla búlgara con chaleco",s:4,r:"6-8 por pierna",t:"3-0-X",d:150,c:"16 kg",niv:1,loc:"Ambos",
     n:"Empieza por la izquierda e iguala las reps de la derecha a lo que haga la izquierda. No subas carga mientras la asimetría siga por encima del 10 %."},
    {x:"Búlgara, serie extra pierna izquierda",s:1,r:"6-8",t:"3-0-X",d:120,c:"16 kg",niv:1,loc:"Ambos",
     n:"Serie temporal por la asimetría del 20 %. Sale del programa cuando la diferencia baje del 10 % en el test."},
    {x:"Pistol squat",s:4,sr:3,r:"2-3 por pierna",t:"3-1-0",d:150,c:"Peso corporal",niv:2,loc:"Ambos",
     n:"Empieza por la izquierda. Ya haces 2 completas, así que entra directo sin fase asistida. Cuando llegues a 5 limpias por lado, sostén una mancuerna de 5 kg al frente como contrapeso: te deja bajar más profundo y es el escalón previo al chaleco."},
    {x:"Peso muerto rumano a una pierna",s:3,sr:2,r:"8-10 por lado",t:"3-0-1",d:120,c:"Mancuernas 5 kg",niv:2,loc:"Ambos",
     n:"Lo que más aporta al salto de todo lo añadido. Con mancuernas carga mejor la bisagra que con chaleco: el peso cuelga de las manos y alarga la palanca sobre la cadera. Empieza por la izquierda."},
    {x:"Isométrico de isquiotibiales",s:4,r:"5 sostenidas de 5 s",t:"Isométrico",d:120,c:"Peso corporal",niv:3,loc:"Ambos",
     n:"Etapa 1 de la escalera del nórdico. Inclínate solo 15-20° y sostén sin temblor. Avanzas a la banda cuando aguantes 8 s."}
   ]},
   {t:"Accesorio",ej:[
    {x:"Flexión de talones unilateral",s:4,r:"8-10 por pierna",t:"2-1-2",d:90,c:"16 kg",niv:3,loc:"Ambos",
     n:"Desde un escalón, con el talón cayendo por debajo del borde. Empieza por la izquierda: también ahí hay 11 % de asimetría."}
   ]}
  ]},

 {id:"tiron-a",grupo:"Tirón",var:"Prono",foco:"Tirón pesado, control escapular y core",
  bloques:[
   {t:"Fuerza",ej:[
    {x:"Dominada prona con chaleco",s:5,r:"3-5",t:"2-0-X",d:150,c:"16 kg",niv:1,loc:"Ambos",
     n:"Estricta: cuelgue completo, sin balanceo ni patada, barbilla claramente sobre la barra. Si no llegas a 3, quita peso del chaleco, no te ayudes con impulso."},
    {x:"Dominada en anillas, agarre supino",s:3,r:"6-8",t:"2-0-1",d:120,c:"Peso corporal",niv:2,loc:"Ambos",
     n:"Las anillas permiten que la muñeca rote sola. Termina con los codos pegados al cuerpo."}
   ]},
   {t:"Accesorio",ej:[
    {x:"Australiana con pies elevados",s:3,r:"8-10",t:"2-1-1",d:90,c:"16 kg",niv:2,loc:"Ambos",
     n:"Tu único vector horizontal y estaba infravalorado. Pies a la altura de la barra y pausa de 1 s con el pecho tocando."},
    {x:"Y-T-W en anillas (circuito)",s:3,r:"8-10 de cada letra",t:"Lento",d:60,c:"Sin carga",niv:3,loc:"Ambos",
     n:"Una serie es Y, T y W seguidas sin soltar. Sin peso: el objetivo es control. Escápulas abajo y atrás."},
    {x:"Elevación de rodillas colgado con muñequeras",s:3,r:"10-12",t:"2-0-1",d:60,c:"Muñequeras 2 kg",niv:3,loc:"Ambos",
     n:"Colgado de la barra, rodillas al pecho sin balanceo, bajada controlada. Carga el flexor de cadera, que sube la rodilla en el sprint y en la aproximación de remate, y cubre el core antiextensión que salió de piernas fuerza. Sin impacto: no suma contactos."}
   ]},
   {t:"Preventivo",ej:[
    {x:"Rotación externa con banda a 90°",s:3,r:"15 por lado",t:"2-1-2",d:45,c:"Banda ligera",niv:3,loc:"Ambos",
     n:"Métela dentro de los descansos de las dominadas: no interfiere y te ahorra minutos al final. Codo a 90°, sin que el hombro se adelante."},
    {x:"Apertura posterior con banda",s:3,r:"15",t:"2-0-2",d:45,c:"Banda ligera",niv:3,loc:"Ambos",
     n:"Brazos casi extendidos al frente que se abren en arco horizontal. Se siente entre los omóplatos. Si el codo se dobla y la banda va al cuerpo, eso es una remada."},
    {x:"Antirrotación tipo Pallof",s:3,r:"30 s por lado",t:"—",d:45,c:"Banda media",niv:3,loc:"Ambos",
     n:"Banda anclada al costado. Extiende los brazos y sostén las manos en la línea media sin que el tronco rote. Si giras, acércate al anclaje."}
   ]}
  ]},

 {id:"empuje-a",grupo:"Empuje",var:"Paralelas",foco:"Empuje pesado y core rotacional",
  bloques:[
   {t:"Fuerza",ej:[
    {x:"Fondos en paralelas con chaleco",s:5,r:"5-6",t:"3-0-X",d:150,c:"16 kg",niv:1,loc:"Ambos",
     n:"Estrictos: sin rebote abajo y sin balanceo de piernas. Baja hasta hombro a la altura del codo, sin más."},
    {x:"Flexión pike con pies elevados",s:4,r:"6-8",t:"3-0-1",d:120,c:"Peso corporal",niv:2,loc:"Ambos",
     n:"Reemplaza tu flexión regular. Es el patrón del bloqueo y del saque. Sobre las paralelas chicas ganas rango de hombro, que es justo lo que buscas: la cabeza baja por debajo de las manos."}
   ]},
   {t:"Accesorio",ej:[
    {x:"Flexión declinada con chaleco",s:3,r:"8-10",t:"3-1-0",d:90,c:"16 kg",niv:2,loc:"Ambos",
     n:"Pausa de 1 s abajo, sin dejar caer la cadera. Las paralelas chicas te dan más rango si las usas de apoyo."},
    {x:"Flexión explosiva",s:3,r:"5",t:"X",d:120,c:"Sin carga",niv:3,loc:"Ambos",
     n:"Fresco dentro del bloque, nunca al final. Busca máxima velocidad de despegue, no altura."}
   ]},
   {t:"Preventivo",ej:[
    {x:"Gesto de ataque: desaceleración",s:3,r:"10 por lado",t:"1-0-4",d:60,c:"Banda media",niv:3,loc:"Ambos",
     n:"Ancla la banda al frente y resiste la vuelta del brazo durante 4 segundos. El remate lesiona en la frenada, no en el golpe."},
    {x:"Leñador con banda",s:3,r:"12 por lado",t:"2-0-X",d:60,c:"Banda media",niv:3,loc:"Ambos",
     n:"Rota desde la cadera, no desde la lumbar. Es el patrón del remate y el complemento del Pallof."}
   ]}
  ]},

 {id:"piernas-r",grupo:"Piernas",var:"Reactivo",pierna:true,
  foco:"Reactividad, velocidad y cambio de dirección",
  bloques:[
   {t:"Reactividad",plyo:true,ej:"PLYO_REACTIVO"},
   {t:"Velocidad",ej:[
    {x:"Sprint 15-20 m",s:6,sr:4,r:"1 recorrido",t:"X",d:150,c:"Sin carga",niv:2,loc:"Espacio",

/* ============================================================
   ALMACENAMIENTO
   ============================================================ */
const mem = {};
const PFX = "bv:";

/* Tres niveles, en este orden:
   1. window.storage  — solo existe dentro de Claude
   2. localStorage    — el navegador del celular, es el que usa la app instalada
   3. memoria         — último recurso, se pierde al cerrar                      */
const HAY_LS = (()=>{ try{ localStorage.setItem("__p","1"); localStorage.removeItem("__p"); return true; }
                      catch(e){ return false; } })();

async function load(k,def){
  if(k in mem) return mem[k];
  if(window.storage){
    try{ const r = await window.storage.get(k); mem[k] = r ? JSON.parse(r.value) : def; }
    catch(e){ mem[k] = def; }
    return mem[k];
  }
  if(HAY_LS){
    try{ const v = localStorage.getItem(PFX+k); mem[k] = v ? JSON.parse(v) : def; }
    catch(e){ mem[k] = def; }
    return mem[k];
  }
  mem[k] = def;
  return def;
}

async function save(k,v){
  mem[k] = v;
  if(window.storage){
    try{ await window.storage.set(k, JSON.stringify(v)); }catch(e){}
    return;
  }
  if(HAY_LS){ try{ localStorage.setItem(PFX+k, JSON.stringify(v)); }catch(e){} }
}

/* Copia de seguridad: el almacenamiento del navegador se puede borrar
   al limpiar datos, así que conviene exportar el registro de vez en cuando. */
function exportar(){
  const datos = {version:1, exportado:new Date().toISOString(),
                 fase:mem.fase, ciclo:mem.ciclo, registro:mem.registro, activa:mem.activa};
  const url = URL.createObjectURL(new Blob([JSON.stringify(datos,null,2)],{type:"application/json"}));
  const a = document.createElement("a");
  a.href = url;
  a.download = "entrenamiento-"+hoyISO()+".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function importar(file){
  const fr = new FileReader();
  fr.onload = async ()=>{
    try{
      const d = JSON.parse(fr.result);
      if(!d || !Array.isArray(d.registro)) throw new Error("formato");
      fase = d.fase || 3;
      ciclo = d.ciclo || {n:1,hechas:{}};
      registro = d.registro;
      activa = d.activa || null;
      await save("fase",fase); await save("ciclo",ciclo);
      await save("registro",registro); await save("activa",activa);
      sel = activa ? (SESIONES.find(s=>s.id===activa.id) || sugerida()) : sugerida();
      pintaRail(); pinta();
    }catch(e){
      alert("No se pudo leer el archivo. Debe ser un respaldo exportado desde esta misma aplicación.");
    }
  };
  fr.readAsText(file);
}

const hoyISO = ()=>{ const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fechaCorta = iso=>{ const [a,m,d]=iso.split("-").map(Number); return d+" "+MES[m-1]; };
function diasDesde(iso){ const [a,m,d]=iso.split("-").map(Number);
  return Math.round((new Date().setHours(0,0,0,0) - new Date(a,m-1,d).getTime())/86400000); }

const visible = e => e.niv<=nivel && (e.loc==="Ambos" || e.loc===lugar);
function seriesDe(e){
  if(nivel===1 && e.sm) return e.sm;
  if(nivel===2 && e.sr) return e.sr;
  return e.s;
}
function bloquesDe(s){
  return s.bloques.map(b=>{
    let ej = b.ej;
    if(ej==="PLYO_FUERZA") ej = PLYO.fuerza[fase];
    if(ej==="PLYO_REACTIVO") ej = PLYO.reactivo[fase];
    return {...b, ej: ej.filter(visible)};
  }).filter(b=>b.ej.length);
}
const idEj = (s,bi,ei)=> s.id+"-"+bi+"-"+ei+"-"+fase+"-"+nivel+"-"+lugar;

const sugerida = ()=> SESIONES.find(s=>!ciclo.hechas[s.id]) || SESIONES[0];
const hechasDe = s => (activa && activa.id===s.id) ? activa.hechas : {};

function totales(s){
  let ser=0, hec=0, cont=0, contHec=0, baja=0;
  bloquesDe(s).forEach((b,bi)=>b.ej.forEach((e,ei)=>{
    const n = seriesDe(e);
    ser += n;
    const h = Math.min(hechasDe(s)[idEj(s,bi,ei)] || 0, n);
    hec += h;
    if(e.k){ cont += n*e.k; contHec += h*e.k; }
    if(e.kb){ baja += n*e.kb; }
  }));
  return {ser,hec,cont,contHec,baja};
}
function ultimaPierna(){
  const p = registro.filter(r=>{ const s=SESIONES.find(x=>x.id===r.id); return s && s.pierna; });
  return p.length ? p[0].fecha : null;
}
const contactos7 = ()=> registro.filter(r=>diasDesde(r.fecha)<7).reduce((a,r)=>a+(r.contactos||0),0);

function pintaRail(){
  rail.innerHTML = "";
  SESIONES.forEach(s=>{
    const b = document.createElement("button");
    b.className = "sesion" + (ciclo.hechas[s.id] ? " hecha" : "");
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected", vista==="sesion" && s.id===sel.id ? "true":"false");
    b.innerHTML = `<b>${esc(s.grupo)}</b><i>${esc(s.var)}</i>`;
    b.onclick = ()=>{ sel=s; vista="sesion"; pintaRail(); pinta(); window.scrollTo({top:0}); };
    rail.appendChild(b);
  });
  const r = document.createElement("button");
  r.className = "sesion";
  r.setAttribute("aria-selected", vista==="registro" ? "true":"false");
  r.innerHTML = `<b>Registro</b><i>${registro.length} sesiones</i>`;
  r.onclick = ()=>{ vista="registro"; pintaRail(); pinta(); window.scrollTo({top:0}); };
  rail.appendChild(r);
}

        `<button class="chip" data-niv="${n}" aria-pressed="${n===nivel}">${esc(NIVMIN[n])}</button>`).join("")}</div>

      <div class="ctrl-lab">Dónde entrenas</div>
      <div class="ctrl-row">${["Casa","Espacio"].map(l=>
        `<button class="chip" data-lug="${l}" aria-pressed="${l===lugar}">${l==="Casa"?"En casa":"Con espacio"}</button>`).join("")}</div>

      : "Versión reducida: clave más el segundo escalón."}${
      (s.id.startsWith("tiron")||s.id.startsWith("empuje"))
      ? " El bloque preventivo sale de la lista, pero puedes meterlo dentro de los descansos de las series pesadas: no interfiere y no cuesta minutos."
      : ""}</p>`;
  }
  if(s.pierna && lugar==="Casa"){
    html += `<p class="ctrl-note">Versión para poco espacio y techo bajo. Lo que no tiene reemplazo real en casa es la técnica de aproximación y la velocidad máxima: si consigues 20 minutos de patio una vez por semana, cúbrelos ahí y de paso mide el salto de remate.</p>`;
  }
  html += `</header>`;

  if(ciclo.hechas[s.id]){
    html += `<div class="aviso"><b>Ya hiciste esta sesión en el microciclo ${ciclo.n}</b>, el ${fechaCorta(ciclo.hechas[s.id])}.

  } else if(s.id!==sug.id){
    html += `<div class="aviso">La siguiente sugerida del microciclo es <b>${esc(sug.grupo)} ${esc(sug.var)}</b>.
      Si hoy te conviene esta, adelante: el orden importa menos que no saltarse ninguna.
      <button data-ir="${sug.id}">Ir a la sugerida</button></div>`;
  }
  if(s.pierna){
    const up = ultimaPierna();

  html += `<section class="phase">
    <div class="phase-row">${[1,2,3].map(n=>
      `<button class="chip" data-fase="${n}" aria-pressed="${n===fase}">${esc(FASES[n].lab)}</button>`).join("")}</div>
    <p>${esc(FASES[fase].txt)}</p></section>`;

  html += `<details class="panel"><summary>Calentamiento</summary><div class="panel-body"><ul>
    ${CAL.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div></details>`;
  html += `<details class="panel"><summary>Reglas de la sesión</summary><div class="panel-body"><ul>
    ${REGLAS.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div></details>`;
  html += `<details class="panel"><summary>Si hoy juegas</summary><div class="panel-body">
    <h4>Entrenar y jugar el mismo día</h4><ul>${JUEGO.antes.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
    <h4>Calentamiento antes de jugar, 12 a 15 min</h4><ul>${JUEGO.calentar.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
    <h4>Lo que no va antes, y qué hacer después</h4><ul>${JUEGO.despues.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
    </div></details>`;

  bloquesDe(s).forEach((b,bi)=>{
    html += `<section class="block${b.plyo?" plyo":""}">
      <div class="block-head"><h2>${esc(b.t)}</h2><span>${b.ej.reduce((a,e)=>a+seriesDe(e),0)} series</span></div>`;
    b.ej.forEach((e,ei)=>{
      const id = idEj(s,bi,ei), n = seriesDe(e), h = Math.min(hechasDe(s)[id]||0, n);
      const desc = e.d>=60 ? (e.d/60).toFixed(e.d%60?1:0).replace(".5","½")+" min" : e.d+" s";
      const tag = e.niv===1 ? `<span class="tag clave">Clave</span>` :
                  (e.loc!=="Ambos" ? `<span class="tag">${e.loc==="Casa"?"Casa":"Espacio"}</span>` : "");
      html += `<article class="ex${h>=n?" complete":""}">
        <div class="ex-top"><div class="ex-num">${ei+1}</div><h3 class="ex-name">${esc(e.x)}</h3>${tag}</div>
        <div class="spec">
          <div><b>${n} × ${esc(e.r)}</b><small>Series y reps</small></div>
          <div><b>${esc(e.c)}</b><small>Carga</small></div>
          <div><b>${esc(e.t)}</b><small>Tempo</small></div>
          <div><b>${desc}</b><small>Descanso</small></div>
        </div>
        <div class="sets">${Array.from({length:n},(_,i)=>
          `<button class="set" data-id="${id}" data-i="${i+1}" data-d="${e.d}" data-x="${esc(e.x)}" aria-pressed="${i<h}" aria-label="Serie ${i+1}">${i+1}</button>`).join("")}
          ${e.k?`<span class="hint">${e.k} contactos por serie</span>`:""}
          ${e.kb?`<span class="hint">${e.kb} contactos de baja amplitud por serie</span>`:""}
        </div>
        <p class="note">${esc(e.n)}</p>
      </article>`;
    });
    html += `</section>`;
  });

  html += `<div class="foot">
    <button class="btn main" id="fin" ${T.hec?"":"disabled"}>Terminar y guardar</button>
    <button class="btn" id="reset">Borrar lo marcado</button>
    <p class="foot-note">${enCurso
      ? "Sesión en curso desde el "+fechaCorta(activa.inicio)+". Lo marcado se conserva aunque cierres la aplicación."
      : "Marca la primera serie para empezar. Lo marcado se conserva aunque cierres la aplicación."}</p>
  </div>`;

  app.innerHTML = html;
  app.querySelectorAll("[data-ir]").forEach(b=>b.onclick=()=>{
    sel = SESIONES.find(x=>x.id===b.dataset.ir); pintaRail(); pinta(); window.scrollTo({top:0}); });
  app.querySelectorAll("[data-fase]").forEach(c=>c.onclick=async()=>{
    fase=+c.dataset.fase; await save("fase",fase); pinta(); });
  app.querySelectorAll("[data-niv]").forEach(c=>c.onclick=async()=>{
    nivel=+c.dataset.niv; await save("nivel",nivel); pinta(); });
  app.querySelectorAll("[data-lug]").forEach(c=>c.onclick=async()=>{
    lugar=c.dataset.lug; await save("lugar",lugar); pinta(); });
  app.querySelectorAll(".set").forEach(b=>b.onclick=()=>toggle(b));
  document.getElementById("fin").onclick = terminar;
  document.getElementById("reset").onclick = async()=>{
    if(activa && activa.id===sel.id){ activa=null; await save("activa",null); }
    pararDescanso(); pinta(); };
}

function pintaRegistro(){
  const ult28 = registro.filter(r=>diasDesde(r.fecha)<28);
  const grupos = {};
  ult28.forEach(r=>{ const s=SESIONES.find(x=>x.id===r.id); if(s) grupos[s.grupo]=(grupos[s.grupo]||0)+1; });

  let html = `<div class="reg"><h2>Registro</h2>
    <p class="reg-sub">Cada sesión terminada queda guardada con su fecha, la versión que hiciste, las series completadas y los contactos de salto.</p>
    <div class="stats">
      <div class="stat"><div class="n">${registro.length}</div><div class="lab">Sesiones terminadas</div></div>
      <div class="stat"><div class="n">${ult28.length}</div><div class="lab">En los últimos 28 días</div></div>
      <div class="stat"><div class="n">${contactos7()}</div><div class="lab">Contactos en 7 días</div></div>
      <div class="stat"><div class="n">${ciclo.n}</div><div class="lab">Microciclo actual</div></div>
    </div>`;
  if(ult28.length) html += `<p class="reg-sub">Últimos 28 días por grupo: ` +
    ["Piernas","Tirón","Empuje"].map(g=>`${g} ${grupos[g]||0}`).join(", ") + `.</p>`;

  if(!registro.length){
    html += `<p class="vacio">Todavía no hay sesiones guardadas. Termina una sesión con el botón
      «Terminar y guardar» y aparecerá aquí con la fecha.</p>`;
  } else {
    registro.forEach(r=>{
      const s = SESIONES.find(x=>x.id===r.id) || {grupo:r.id,var:""};
      const detalle = [s.var, r.nivel?NIVLAB[r.nivel]:null, (s.pierna&&r.lugar)?(r.lugar==="Casa"?"en casa":"con espacio"):null]
                        .filter(Boolean).join(", ");
      html += `<div class="entry">
        <div class="f">${fechaCorta(r.fecha)}</div>
        <div class="g">${esc(s.grupo)}<small>${esc(detalle)}</small></div>
        <div class="v">${r.series} de ${r.total} series${r.contactos?"<br>"+r.contactos+" contactos":""}</div>
      </div>`;
    });
    html += `<div class="foot">
      <button class="btn" id="exportar">Descargar respaldo</button>
      <button class="btn" id="importar">Restaurar respaldo</button>
      <button class="btn" id="borrar">Borrar todo el registro</button>
      <input type="file" id="archivo" accept="application/json" hidden>
      <p class="foot-note">El registro vive en el navegador del celular. Si borras los datos del navegador o cambias de equipo, se pierde. Descarga un respaldo cada tanto.</p>
    </div>`;
  }
  html += `</div>`;
  app.innerHTML = html;
  const ex = document.getElementById("exportar");
  if(ex) ex.onclick = exportar;
  const im = document.getElementById("importar");
  const ar = document.getElementById("archivo");
  if(im && ar){
    im.onclick = ()=>ar.click();
    ar.onchange = ()=>{ if(ar.files[0]) importar(ar.files[0]); };
  }
  const b = document.getElementById("borrar");
  if(b) b.onclick = async()=>{
    registro=[]; ciclo={n:1,hechas:{}};
    await save("registro",registro); await save("ciclo",ciclo);
    pintaRail(); pinta(); };
}

async function toggle(btn){
  const id = btn.dataset.id, i = +btn.dataset.i;
  if(!activa || activa.id!==sel.id) activa = {id:sel.id, inicio:hoyISO(), hechas:{}};
  const actual = activa.hechas[id] || 0;
  const nuevo = (i<=actual) ? i-1 : i;
  activa.hechas[id] = nuevo;
  await save("activa", activa);
  pinta();
  if(nuevo>actual) iniciaDescanso(+btn.dataset.d, btn.dataset.x, i);
}

async function terminar(){
  const T = totales(sel);
  registro.unshift({id:sel.id, fecha:hoyISO(), series:T.hec, total:T.ser,
                    contactos:T.contHec, baja:T.baja, nivel:nivel,
                    lugar:sel.pierna?lugar:null, ciclo:ciclo.n});
  ciclo.hechas[sel.id] = hoyISO();
  if(SESIONES.every(s=>ciclo.hechas[s.id])) ciclo = {n:ciclo.n+1, hechas:{}};
  activa = null;
  await save("registro",registro); await save("ciclo",ciclo); await save("activa",null);
  pararDescanso();
  sel = sugerida();
  pintaRail(); pinta(); window.scrollTo({top:0});
}

/* ============================================================
   DESCANSO
   ============================================================ */
const rest=document.getElementById("rest"), restTime=document.getElementById("restTime"),
      restLab=document.getElementById("restLab"), restBar=document.getElementById("restBar");
let tick=null, restan=0, total=0;
const fmt = s=>{const neg=s<0;s=Math.abs(s);return (neg?"+":"")+Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
function iniciaDescanso(seg,nombre,serie){
  clearInterval(tick); restan=seg; total=seg;
  restLab.textContent = nombre+", serie "+serie+" hecha";
  rest.classList.add("up"); rest.classList.remove("over"); dibuja();
  tick = setInterval(()=>{ restan--;
    if(restan===0){ pitido(); rest.classList.add("over"); }
    if(restan<-120) return pararDescanso();
    dibuja(); },1000);
}
function dibuja(){ restTime.textContent=fmt(restan);
  restBar.style.width = Math.max(0,Math.min(100,restan/total*100))+"%"; }
function pararDescanso(){ clearInterval(tick); tick=null; rest.classList.remove("up","over"); }
function pitido(){
  try{
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.18].forEach(off=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.frequency.value=880; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001,ac.currentTime+off);
      g.gain.exponentialRampToValueAtTime(0.25,ac.currentTime+off+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+off+0.14);
      o.start(ac.currentTime+off); o.stop(ac.currentTime+off+0.16);
    });
    if(navigator.vibrate) navigator.vibrate([120,60,120]);
  }catch(e){}
}
document.getElementById("restAdd").onclick=()=>{restan+=30;total=Math.max(total,restan);
  rest.classList.remove("over");dibuja();};
document.getElementById("restEnd").onclick=pararDescanso;

/* ============================================================
   ARRANQUE
   ============================================================ */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

(async ()=>{
  fase = await load("fase",3) || 3;
  nivel = await load("nivel",3) || 3;
  lugar = await load("lugar","Casa") || "Casa";
  ciclo = await load("ciclo",{n:1,hechas:{}}) || {n:1,hechas:{}};
  registro = await load("registro",[]) || [];
  activa = await load("activa",null);
  sel = activa ? (SESIONES.find(s=>s.id===activa.id) || sugerida()) : sugerida();
  pintaRail(); pinta();
})();
</script>
